icon: source_mygo/assets/icon.png
tasks:
  - label: Run
    group: run
    command: go
    args: [tool, mygo, dev]
    options:
      cwd: source_mygo
      env:
        GOWORK: "off"
  - label: Build
    group: build
    command: go
    args: [tool, mygo, build, -platform, "darwin/universal,windows/amd64,windows/arm64,linux/amd64,linux/arm64"]
    options:
      cwd: source_mygo
      env:
        GOWORK: "off"
    outputDirectory: ../dist
  - label: Test
    command: go
    args: [test, ./...]
    options:
      cwd: source_mygo
      env:
        GOWORK: "off"
  - label: Vet
    command: go
    args: [tool, mygo, vet]
    options:
      cwd: source_mygo
      env:
        GOWORK: "off"
